<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Login | Hotel</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f3f5f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px #17203312;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .muted {
            color: #697386;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8deea;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #2459d3;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #b42318;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to the hotel management system.</p>

        {% if form.errors %}
        <p class="error">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input id="id_username" name="username" autocomplete="username" required autofocus>

            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>

</html>
